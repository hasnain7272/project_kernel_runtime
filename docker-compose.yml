"""Docker Compose for Project Kernel Runtime - Local Development.

Usage:
  docker-compose up -d          # Start all services
  docker-compose up -d --build  # Rebuild and start
  docker-compose logs -f app    # View logs
  docker-compose down           # Stop all services
"""
version: "3.8"

services:
  # Main Application
  app:
    build: .
    container_name: kernel-runtime
    ports:
      - "8089:8089"
    environment:
      - ENVIRONMENT=development
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=sqlite:///data/kernel.db
      - REDIS_URL=redis://redis:6379/0
      - HYBRID_MODE=true
      - ALLOW_ANON_LOCAL=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key-change-me}
    volumes:
      - ./data:/app/data
      - ./workspace:/workspace
    depends_on:
      - redis
    networks:
      - kernel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for message queue and caching
  redis:
    image: redis:7-alpine
    container_name: kernel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kernel-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Optional: PostgreSQL for production-like setup
  # Uncomment to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: kernel-postgres
  #   environment:
  #     - POSTGRES_USER=kernel
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kernel-pass}
  #     - POSTGRES_DB=kernel
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - kernel-network
  #   restart: unless-stopped

  # Optional: Caddy reverse proxy with HTTPS
  # Uncomment for production-like HTTPS setup
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: kernel-caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   networks:
  #     - kernel-network
  #   restart: unless-stopped

volumes:
  redis-data:
  # postgres-data:
  # caddy-data:
  # caddy-config:

networks:
  kernel-network:
    driver: bridge
