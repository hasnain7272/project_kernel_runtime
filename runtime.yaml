version: 2.0.0
api_version: 2026-03
mode: production
modes:
- http
- cli
- mcp
governance:
  enabled: true
  default_role: developer
  require_approval_for:
  - git_commit
  - bash_execute
  policy_matrix:
    plan:
      read_only: true
      write: false
      execute: true
      network: true
    review:
      read_only: true
      write: false
      execute: true
      network: true
    research:
      read_only: true
      write: false
      execute: true
      network: true
    build:
      read_only: true
      write: true
      execute: true
      network: true
  network_allowlist:
  - api.openai.com
  - api.anthropic.com
  - pypi.org
  - registry.npmjs.org
  - github.com
  - api.github.com
  audit_log_enabled: true
  audit_log_path: ./data/audit.db
  max_tool_timeout_seconds: 300
  agentrules_filename: .agentrules
mcp:
  enabled: true
  transport: streamable_http
  host: 0.0.0.0
  port: 8090
  protocol_versions:
  - '2025-03-26'
  - '2024-11-05'
  session_timeout_seconds: 3600
  max_sessions: 100
  tools_enabled: true
  resources_enabled: true
  prompts_enabled: true
  sampling_enabled: false
mcpServers: null
sandbox:
  backend: subprocess
  docker_image: python:3.11-slim
  memory_limit_mb: 512
  cpu_limit: 1.0
  network_mode: none
  network_allowlist: []
  timeout_seconds: 300
  working_dir: ./workspace
  max_concurrent_sandboxes: 5
  cleanup_on_exit: true
llm:
  active_model: ollama/llama3.1:8b
  providers:
  - name: ollama
    base_url: http://127.0.0.1:11500
    default_model: ollama/llama3.1:8b
    priority: 0
    enabled: true
  - name: nvidia_nim
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_NIM_API_KEY
    default_model: meta/llama-3.1-70b-instruct
    priority: 1
    enabled: false
  - name: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-sonnet-4-20250514
    priority: 2
    enabled: false
  - name: openai
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o
    priority: 3
    enabled: false
  # NVIDIA NIM Configuration (for complex tasks - uses NVIDIA AI Endpoints)
  nvidia_nim:
    enabled: true  # Enabled - agent will fall back to NIM when local model fails
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_NIM_API_KEY  # Set env var or use UI to configure
    # Models per task type - uses Nemotron for complex reasoning tasks
    models:
      planning: nvidia/nemotron-3-super-120b-a12b
      execution: nvidia/nemotron-3-super-120b-a12b
      verification: nvidia/nemotron-3-super-120b-a12b
      research: nvidia/nemotron-3-super-120b-a12b
      architecture: nvidia/nemotron-3-super-120b-a12b
  model_router:
    autocomplete: ollama/llama3.1:8b
    code_generation: ollama/llama3.1:8b
    architecture: ollama/llama3.1:8b
    research: ollama/llama3.1:8b
  fallback_enabled: false
  max_retries: 3
  rate_limit_rpm: 60
  cost_tracking_enabled: true
vector_db:
  backend: chromadb
  persist_dir: ./data/chroma_db
  collection_name: agent_memory
  embedding_model: all-MiniLM-L6-v2
  max_results: 10
  enable_codebase_rag: true
  rag_chunk_size: 512
  rag_chunk_overlap: 50
a2a:
  enabled: true
  agent_name: Antigravity Kernel
  agent_description: Production-grade AI coding agent kernel
  endpoint_url: http://localhost:8089
  version: '0.3'
  authentication: api_key
  discoverable: true
observability:
  log_level: INFO
  log_format: json
  metrics_enabled: true
  metrics_port: 9090
  tracing_enabled: false
  health_check_interval_seconds: 30
skills:
  core:
  - file_operations
  - terminal_execution
  - git_operations
  - web_operations
  - lsp_integration
  domain: []
  auto_discover: true
  coding:
  - debugging
features:
  gtm_swarm: true
  vision_swarm: false
  federated_hub: false
  mesh_p2p: true
  sre_swarm: true
  credits_engine: false
  multi_tenancy: false
  skill_compiler: true
  predictive: true
  wasm_driver: false
  self_attention: true
server:
  host: 0.0.0.0
  port: 8089
  cors_origins:
  - '*'
  api_key_header: X-API-Key
  rate_limit_enabled: true
  rate_limit_per_minute: 120
  static_files_dir: ui/web
workspace_adapters:
- local
- git_worktree
- containerized
data_dir: ./data
project_registry:
  folders:
  - ./workspace
  - D:\AI_Content_Studio\ai_blender_cinematic\antigravity\session_test_folder1
