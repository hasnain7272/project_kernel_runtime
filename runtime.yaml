# ============================================================================
# Antigravity Project Kernel Runtime — Configuration v2.0
# ============================================================================
# Schema v2: Fully typed subsections matching Pydantic models in core/runtime.py
# Environment variables override: PKR_<SECTION>_<KEY>=value
# ============================================================================

version: "2.0.0"
api_version: "2026-03"
mode: "development"

# Deployment modes supported
modes:
  - http
  - cli
  - mcp

# ── Governance & Security ──
governance:
  enabled: true
  default_role: "developer"
  require_approval_for:
    - git_commit
    - bash_execute
  policy_matrix:
    plan:
      read_only: true
      write: false
      execute: false
      network: false
    review:
      read_only: true
      write: false
      execute: false
      network: false
    research:
      read_only: true
      write: false
      execute: false
      network: true
    build:
      read_only: true
      write: true
      execute: true
      network: true
  network_allowlist:
    - api.openai.com
    - api.anthropic.com
    - pypi.org
    - registry.npmjs.org
    - github.com
    - api.github.com
  audit_log_enabled: true
  audit_log_path: "./data/audit.db"
  max_tool_timeout_seconds: 300
  agentrules_filename: ".agentrules"

# ── MCP Protocol ──
mcp:
  enabled: true
  transport: "streamable_http"
  host: "0.0.0.0"
  port: 8090
  protocol_versions:
    - "2025-03-26"
    - "2024-11-05"
  session_timeout_seconds: 3600
  max_sessions: 100
  tools_enabled: true
  resources_enabled: true
  prompts_enabled: true
  sampling_enabled: false

# ── Sandbox / Execution Isolation ──
sandbox:
  backend: "subprocess"
  docker_image: "python:3.11-slim"
  memory_limit_mb: 512
  cpu_limit: 1.0
  network_mode: "none"
  network_allowlist: []
  timeout_seconds: 300
  working_dir: "./workspace"
  max_concurrent_sandboxes: 5
  cleanup_on_exit: true

# ── LLM Providers ──
llm:
  active_model: "ollama/qwen2.5-coder:7b-instruct-q4_K_M"
  providers:
    - name: "ollama"
      base_url: "http://127.0.0.1:11500"
      default_model: "ollama/qwen2.5-coder:7b-instruct-q4_K_M"
      priority: 0
      enabled: true
    - name: "anthropic"
      api_key_env: "ANTHROPIC_API_KEY"
      default_model: "claude-sonnet-4-20250514"
      priority: 1
      enabled: false
    - name: "openai"
      api_key_env: "OPENAI_API_KEY"
      default_model: "gpt-4o"
      priority: 2
      enabled: false
  model_router:
    autocomplete: "ollama/qwen2.5-coder:7b-instruct-q4_K_M"
    code_generation: "ollama/qwen2.5-coder:7b-instruct-q4_K_M"
    architecture: "ollama/qwen2.5-coder:7b-instruct-q4_K_M"
    research: "ollama/qwen2.5-coder:7b-instruct-q4_K_M"
  fallback_enabled: false
  max_retries: 3
  rate_limit_rpm: 60
  cost_tracking_enabled: true

# ── Vector DB / Agent Memory ──
vector_db:
  backend: "chromadb"
  persist_dir: "./data/chroma_db"
  collection_name: "agent_memory"
  embedding_model: "all-MiniLM-L6-v2"
  max_results: 10
  enable_codebase_rag: true
  rag_chunk_size: 512
  rag_chunk_overlap: 50

# ── A2A (Agent-to-Agent) Protocol ──
a2a:
  enabled: true
  agent_name: "Antigravity Kernel"
  agent_description: "Production-grade AI coding agent kernel"
  endpoint_url: "http://localhost:8089"
  version: "0.3"
  authentication: "api_key"
  discoverable: true

# ── Observability ──
observability:
  log_level: "INFO"
  log_format: "json"
  metrics_enabled: true
  metrics_port: 9090
  tracing_enabled: false
  health_check_interval_seconds: 30

# ── Skills Registry ──
skills:
  core:
    - file_operations
    - terminal_execution
    - git_operations
    - lsp_integration
    - error_recovery
    - browser_automation
    - web_search
    - custom_tools
  domain:
    - blender
    - coding
    - research
  auto_discover: true

# ── Feature Flags ──
features:
  gtm_swarm: false
  vision_swarm: false
  federated_hub: false
  mesh_p2p: false
  sre_swarm: true
  credits_engine: false
  multi_tenancy: false
  skill_compiler: true
  predictive: true
  wasm_driver: false
  self_attention: true

# ── HTTP Server ──
server:
  host: "0.0.0.0"
  port: 8089
  cors_origins:
    - "*"
  api_key_header: "X-API-Key"
  rate_limit_enabled: true
  rate_limit_per_minute: 120
  static_files_dir: "ui/web"

# Workspace adapters
workspace_adapters:
  - local
  - git_worktree
  - containerized

# Data persistence directory
data_dir: "./data"
