apiVersion: v1
kind: Namespace
metadata:
  name: antigravity-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ServiceAccount for sandbox jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-runner
  namespace: antigravity-sandbox
automountServiceAccountToken: false
---
# Role for sandbox operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: antigravity-sandbox
  name: sandbox-manager
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-runner-binding
  namespace: antigravity-sandbox
subjects:
- kind: ServiceAccount
  name: sandbox-runner
  namespace: antigravity-sandbox
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io
---
# PersistentVolumeClaim for workspace
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-pvc
  namespace: antigravity-sandbox
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
# ResourceQuota to prevent abuse
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: antigravity-sandbox
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "20"
    count/jobs.batch: "50"
---
# LimitRange for default resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-limits
  namespace: antigravity-sandbox
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "2000m"
      memory: "2Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container
---
# NetworkPolicy to deny all egress by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-egress
  namespace: antigravity-sandbox
spec:
  podSelector: {}
  policyTypes:
  - Egress
  # No egress rules = deny all
---
# NetworkPolicy to allow DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-allow-dns
  namespace: antigravity-sandbox
spec:
  podSelector:
    matchLabels:
      app: antigravity-sandbox
  policyTypes:
  - Egress
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 53