apiVersion: v1
kind: ServiceAccount
metadata:
  name: antigravity-worker
  namespace: antigravity
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: antigravity-worker-role
  namespace: antigravity
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: antigravity-sandbox-role
  namespace: antigravity-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: antigravity-worker-binding
  namespace: antigravity
subjects:
  - kind: ServiceAccount
    name: antigravity-worker
    namespace: antigravity
roleRef:
  kind: Role
  name: antigravity-worker-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: antigravity-sandbox-binding
  namespace: antigravity-sandbox
subjects:
  - kind: ServiceAccount
    name: antigravity-worker
    namespace: antigravity
roleRef:
  kind: Role
  name: antigravity-sandbox-role
  apiGroup: rbac.authorization.k8s.io