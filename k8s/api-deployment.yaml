apiVersion: apps/v1
kind: Deployment
metadata:
  name: antigravity-api
  namespace: antigravity
  labels:
    app: antigravity-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: antigravity-api
  template:
    metadata:
      labels:
        app: antigravity-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: antigravity/runtime:3.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
              name: http
          envFrom:
            - configMapRef:
                name: antigravity-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: antigravity-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: antigravity-api
  namespace: antigravity
spec:
  type: ClusterIP
  selector:
    app: antigravity-api
  ports:
    - port: 80
      targetPort: 8089
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: antigravity-api-hpa
  namespace: antigravity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: antigravity-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60