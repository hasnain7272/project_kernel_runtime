[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-kernel-runtime"
version = "3.0.0"
description = "Production-grade agentic runtime with ReAct loop, sandboxed tool execution, and persistent LLM memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "asyncpg>=0.29",
  "litellm>=1.48,<2.0",
  "redis>=5.0",
  "aiofiles>=23.2",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
